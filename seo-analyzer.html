<!DOCTYPE html>
<html>
<head>
    <title>SEO Analyzer - Free Tool</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 0 auto; padding: 2rem; }
        input { width: 70%; padding: 12px; font-size: 16px; }
        button { padding: 12px 24px; background: #667eea; color: white; border: none; font-size: 16px; cursor: pointer; }
        #result { margin-top: 2rem; padding: 1rem; background: #f5f5f5; border-radius: 8px; display: none; }
    </style>
</head>
<body>
    <h1>Free SEO Analyzer</h1>
    <p>Enter any URL to analyze its SEO:</p>
    <input type="url" id="url" placeholder="https://example.com">
    <button onclick="analyze()">Analyze</button>
    <div id="result"></div>
    
    <script>
    async function analyze() {
        const url = document.getElementById('url').value;
        if (!url) return;
        
        document.getElementById('result').style.display = 'block';
        document.getElementById('result').innerHTML = 'Analyzing...';
        
        try {
            const resp = await fetch('/analyze?url=' + encodeURIComponent(url));
            const data = await resp.json();
            
            let html = '<h2>Results</h2>';
            html += '<p>SEO Score: <strong>' + data.seo_score + '/100</strong> (' + data.grade + ')</p>';
            html += '<p>Title: ' + (data.title || 'None') + '</p>';
            
            if (data.issues && data.issues.length > 0) {
                html += '<h3>Issues Found:</h3><ul>';
                for (const issue of data.issues) {
                    html += '<li>' + issue + '</li>';
                }
                html += '</ul>';
            }
            
            document.getElementById('result').innerHTML = html;
        } catch (e) {
            document.getElementById('result').innerHTML = 'Error: ' + e.message;
        }
    }
    </script>
</body>
</html>
