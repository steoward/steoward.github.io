<!DOCTYPE html>
<html>
<head><title>Content Generator</title>
<style>body{font-family:sans-serif;max-width:800px;margin:0 auto;padding:2rem}textarea{width:100%;height:200px;padding:12px}button{padding:12px 24px;background:#667eea;color:#fff;border:none;cursor:pointer;margin-top:1rem}</style>
</head>
<body>
    <h1>AI Content Generator</h1>
    <p>Enter a topic:</p>
    <input type="text" id="topic" placeholder="e.g., AI for small business" style="width:100%;padding:12px;font-size:16px">
    <button onclick="generate()">Generate Content</button>
    <div id="result" style="margin-top:2rem;padding:1rem;background:#f5f5f5;border-radius:8px;white-space:pre-wrap"></div>
    <script>
    async function generate() {
        const topic = document.getElementById('topic').value;
        const resp = await fetch('/generate?topic=' + encodeURIComponent(topic));
        const data = await resp.json();
        document.getElementById('result').textContent = data.content || data.error;
    }
    </script>
</body>
</html>
